services:
  super-chat-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: super-chat-manager:latest
    container_name: super-chat-manager
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - REDIS_ENABLED=false
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-lcp}
    ports:
      - "172.17.0.1:3000:${PORT:-3010}"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - |
          const h = require('http');
          const port = String(process.env.PORT || 3010).replace(/^["']|["']$/g, '');
          if (!/^\d+$/.test(port)) process.exit(1);
          h.get('http://localhost:' + port + '/health', r => {
            process.exit(r.statusCode === 200 ? 0 : 1);
          }).on('error', () => process.exit(1));
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: super-chat-manager-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  redis_data:
    driver: local
