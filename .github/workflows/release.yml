name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push versioned image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/super-chat-manager"
          version="${GITHUB_REF_NAME#v}"
          docker build --pull \
            -t "$image:${GITHUB_REF_NAME}" \
            -t "$image:${version}" \
            -t "$image:latest" .
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:${version}"
          docker push "$image:latest"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Super Chat Manager ${GITHUB_REF_NAME}" --notes-file "$notes" --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "Super Chat Manager ${GITHUB_REF_NAME}" --notes-file "$notes" --latest
          fi
